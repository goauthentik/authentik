---
name: CI - Main daily

on:
  workflow_dispatch:
  schedule:
    # Every night at 3am
    - cron: "0 3 * * *"
  pull_request:
    paths:
      # Needs to refer to itself
      - .github/workflows/ci-main-daily.yml

jobs:
  test-container:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        version:
          - docs
          - version-2026-5
          - version-2026-8
    steps:
      - run: |
          set -euo pipefail
          dir="/tmp/authentik/${{ matrix.version }}"
          wget "https://${{ matrix.version }}.goauthentik.io/compose.yml" -O /tmp/compose.yml
          # Test the release that the compose file runs, with that release's own script
          tag="$(grep -m1 -o 'AUTHENTIK_TAG:-[^}]*' /tmp/compose.yml)"
          tag="${tag#AUTHENTIK_TAG:-}"
          git clone --depth 1 --branch "version/${tag}" https://github.com/goauthentik/authentik.git "${dir}"
          cp /tmp/compose.yml "${dir}/lifecycle/container/compose.yml"
          cd "${dir}"
          ./scripts/test_docker.sh
