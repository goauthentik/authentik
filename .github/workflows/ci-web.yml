---
name: CI - Web

on:
  push:
    branches:
      - main
      - next
      - version-*
  pull_request:
    branches:
      - main
      - version-*

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: "${{ !startsWith(github.ref, 'refs/heads/version-') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' }}"

jobs:
  # Determines whether the pull request touches anything besides documentation.
  # Everything that only validates code is gated on this, so that docs-only
  # pull requests don't run the full test suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: "${{ steps.detect.outputs.code }}"
      bundled-docs: "${{ steps.detect.outputs.bundled-docs }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          filter: blob:none
      - id: detect
        uses: ./.github/actions/detect-changes
  lint:
    if: "${{ needs.changes.outputs.code == 'true' }}"
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Pin pnpm store directory
        run: |
          echo "PNPM_HOME=${RUNNER_TEMP}/pnpm-home" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=${RUNNER_TEMP}/pnpm-home/store" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile
      - name: Lint
        run: pnpm --dir web run lint-check
      - name: Check types
        run: pnpm --dir web run tsc
      - name: Check formatting
        run: pnpm --dir web run prettier-check
      - name: Lit analyse
        run: pnpm --dir web run lit-analyse

  build:
    # Also runs for documentation that is compiled into the bundle: a malformed
    # file under website/docs fails this build, so it is the canary that keeps
    # the skipped server container build honest.
    if: "${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.bundled-docs == 'true' }}"
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Pin pnpm store directory
        run: |
          echo "PNPM_HOME=${RUNNER_TEMP}/pnpm-home" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=${RUNNER_TEMP}/pnpm-home/store" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile
      - name: build
        env:
          NODE_ENV: "production"
        working-directory: web/
        run: pnpm run build
  ci-web-mark:
    if: always()
    needs:
      - build
      - lint
      - changes
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          # Docs-only pull requests skip every code job; see the `changes` job.
          allowed-skips: "build, lint"
          jobs: ${{ toJSON(needs) }}
  test:
    if: "${{ needs.changes.outputs.code == 'true' }}"
    needs:
      - ci-web-mark
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Pin pnpm store directory
        run: |
          echo "PNPM_HOME=${RUNNER_TEMP}/pnpm-home" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=${RUNNER_TEMP}/pnpm-home/store" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile
      - name: test
        working-directory: web/
        run: pnpm exec vitest run --project "Unit Tests"
