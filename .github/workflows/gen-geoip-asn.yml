---
name: Gen - GeoIP ASN

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday morning UTC
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Setup authentik env
        uses: ./.github/actions/setup
        with:
          dependencies: node
      - name: Build ASN database
        run: pnpm --dir packages/geo run asn:build --refresh
      - id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/geo
          file: packages/geo/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/goauthentik/geoip:latest
            ghcr.io/goauthentik/geoip:${{ steps.date.outputs.date }}
