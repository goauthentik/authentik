---
name: QA - CodeQL

on:
  push:
    branches: [main, next, version*]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 5"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - lang: "go"
            deps: "system,go,runtime"
          - lang: "javascript"
            deps: "system,node,runtime"
          - lang: "python"
            deps: "system,python,rust,runtime"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Setup authentik env
        uses: ./.github/actions/setup
        with:
          dependencies: ${{ matrix.language.deps }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language.lang }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
