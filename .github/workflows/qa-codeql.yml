---
name: QA - CodeQL

on:
  push:
    branches: [main, next, version*]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 5"

jobs:
  # Determines whether the pull request touches anything besides documentation.
  # Everything that only validates code is gated on this, so that docs-only
  # pull requests don't run the full test suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: "${{ steps.detect.outputs.code }}"
      bundled-docs: "${{ steps.detect.outputs.bundled-docs }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          filter: blob:none
      - id: detect
        uses: ./.github/actions/detect-changes
  analyze:
    if: "${{ !cancelled() && needs.changes.outputs.code != 'false' }}"
    needs:
      - changes
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["go", "javascript", "python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Setup authentik env
        uses: ./.github/actions/setup
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
