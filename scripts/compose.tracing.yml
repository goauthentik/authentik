## Local OTLP trace testing.
##
## Usage:
##   docker compose -f scripts/compose.tempo.yml up
##
## Then run authentik with:
##   AUTHENTIK_ERROR_REPORTING__ENABLED=true
##   AUTHENTIK_ERROR_REPORTING__OTEL_ENDPOINT=http://localhost:4318
##
## Grafana is at http://localhost:3000 (anonymous admin access), with Tempo
## pre-configured as a datasource. Explore -> Tempo -> Search.

services:
  tempo:
    image: docker.io/grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    configs:
      - source: tempo-config
        target: /etc/tempo.yaml
    ports:
      - 127.0.0.1:4318:4318 # OTLP HTTP receiver
    restart: always
  pyroscope:
    image: docker.io/grafana/pyroscope:latest
    ports:
      - 127.0.0.1:4040:4040
    restart: always

  grafana:
    image: docker.io/grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/tempo.yaml
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - tempo
    restart: always

configs:
  tempo-config:
    content: |
      server:
        http_listen_port: 3200
      distributor:
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 0.0.0.0:4318
      storage:
        trace:
          backend: local
          local:
            path: /tmp/tempo/traces
          wal:
            path: /tmp/tempo/wal
  grafana-datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Pyroscope
          type: grafana-pyroscope-datasource
          access: proxy
          orgId: 1
          uid: pyroscope
          url: http://pyroscope:4040
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          isDefault: true
          uid: tempo
          jsonData:
            tracesToProfiles:
              datasourceUid: 'pyroscope'
              tags: [{ key: 'service.name', value: 'service_name' }]
              profileTypeId: 'process_cpu:cpu:nanoseconds:cpu:nanoseconds'
