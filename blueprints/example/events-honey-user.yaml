# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Example - Honey user login alert
  labels:
    blueprints.goauthentik.io/instantiate: "false"
    blueprints.goauthentik.io/description: |
      Creates decoy users without a password and alerts administrators whenever someone tries to log in as one of them. See the [honey user documentation](https://docs.goauthentik.io/docs/security/honey-user).
context:
  # Pick names that look valuable to an attacker and do not match a real user.
  username: svc-backup-admin
  # A second decoy that looks like a directory administrator, attractive to
  # anyone enumerating the LDAP provider. Set to "" to skip it.
  ldap_admin_username: ldap-admin
  # Users in this group receive the notification.
  group_name: authentik Admins
  # Optional webhook (for example a Slack incoming webhook or a SIEM endpoint).
  # Leave empty to only notify through the authentik UI and email.
  webhook_url: ""
entries:
  # Reuse the default local transport and admin group. "created" adds them only
  # if they are missing and never changes existing ones.
  - model: authentik_events.notificationtransport
    id: local-transport
    state: created
    identifiers:
      name: default-local-transport
    attrs:
      mode: local
  # A dedicated email transport, so the subject says this is a honey user alert
  # and not an ordinary failed login. authentik appends the event action to the
  # prefix, so subjects read "[authentik] honey_user_login_failed".
  - model: authentik_events.notificationtransport
    id: email-transport
    identifiers:
      name: !Format [honey-user-email-%s, !Context username]
    attrs:
      mode: email
      email_subject_prefix: "[authentik] honey_user_"
  # "created" keeps your edits to the message when the blueprint is applied again.
  - model: authentik_events.notificationwebhookmapping
    id: webhook-mapping
    state: created
    conditions:
      - !Context webhook_url
    identifiers:
      name: !Format [honey-user-webhook-%s, !Context username]
    attrs:
      expression: |
        event = notification.event
        username = (event.user or {}).get("username") or event.context.get("username")
        geo = event.context.get("geo") or {}
        asn = event.context.get("asn") or {}
        location = ", ".join(part for part in [geo.get("city"), geo.get("country")] if part)
        if event.action == "login":
            what = "Successful login"
        else:
            what = "Login attempt"
        text = f"Honey user alert: {what} as decoy account {username} from {event.client_ip}"
        if location:
            text += f" ({location})"
        text += ". No legitimate user owns this account."
        # "text" is the message field of Slack incoming webhooks. The other keys
        # are for SIEMs and other tools that parse the payload.
        return {
            "text": text,
            "action": event.action,
            "username": username,
            "client_ip": event.client_ip,
            "geo": geo,
            "asn": asn,
            "user_agent": event.context.get("http_request", {}).get("user_agent"),
            "created": event.created.isoformat(),
        }
  - model: authentik_events.notificationtransport
    id: webhook-transport
    conditions:
      - !Context webhook_url
    identifiers:
      name: !Format [honey-user-webhook-%s, !Context username]
    attrs:
      mode: webhook
      webhook_url: !Context webhook_url
      webhook_mapping_body: !KeyOf webhook-mapping
      # Post once per event, not once per member of the group.
      send_once: true
  - model: authentik_core.group
    id: notify-group
    state: created
    identifiers:
      name: !Context group_name
  # The users have no password, so no login attempt can succeed. Every attempt
  # fails at the password stage and creates a `login_failed` event.
  - model: authentik_core.user
    id: honey-user
    state: created
    identifiers:
      username: !Context username
    attrs:
      name: Backup Service
      type: internal
      is_active: true
  - model: authentik_core.user
    id: honey-ldap-admin
    state: created
    conditions:
      - !Context ldap_admin_username
    identifiers:
      username: !Context ldap_admin_username
    attrs:
      name: LDAP Administrator
      type: internal
      is_active: true
  - model: authentik_policies_event_matcher.eventmatcherpolicy
    id: honey-user-login-failed
    identifiers:
      name: !Format [honey-user-login-failed-%s, !Context username]
    attrs:
      action: login_failed
      query: !Format ['user.username = "%s" or user.username = "%s"', !Context username, !Context ldap_admin_username]
  # The users have no password, so a successful login means a decoy was changed
  # or another authentication method was linked to it.
  - model: authentik_policies_event_matcher.eventmatcherpolicy
    id: honey-user-login
    identifiers:
      name: !Format [honey-user-login-%s, !Context username]
    attrs:
      action: login
      query: !Format ['user.username = "%s" or user.username = "%s"', !Context username, !Context ldap_admin_username]
  - model: authentik_events.notificationrule
    id: honey-user-rule
    identifiers:
      name: !Format [honey-user-notify-%s, !Context username]
    attrs:
      severity: alert
      destination_group: !KeyOf notify-group
      transports: !If
        - !Context webhook_url
        - [!KeyOf local-transport, !KeyOf email-transport, !KeyOf webhook-transport]
        - [!KeyOf local-transport, !KeyOf email-transport]
  # The rule uses the default policy engine mode "any", so either policy triggers it.
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      policy: !KeyOf honey-user-login-failed
      target: !KeyOf honey-user-rule
  - model: authentik_policies.policybinding
    identifiers:
      order: 1
      policy: !KeyOf honey-user-login
      target: !KeyOf honey-user-rule
