version: 1
metadata:
  name: Default - Agent Platform SSO password authentication flow
entries:
# Apple Platform SSO password logins arrive at the token endpoint as a signed login
# request carrying username and password claims, with no browser attached. This flow
# exists so that path is governed by a real flow (and its policies) rather than a bare
# call to the authentication backends, while staying deliberately minimal: macOS has
# already collected the credential, so there is nothing interactive left to prompt for.
- attrs:
    designation: authentication
    name: Agent Platform SSO password authentication
    title: Agent Platform SSO password authentication
    authentication: none
  identifiers:
    slug: endpoints-agent-psso-password
  model: authentik_flows.flow
  id: flow
- attrs:
    backends:
    - authentik.core.auth.InbuiltBackend
    - authentik.sources.kerberos.auth.KerberosBackend
    - authentik.sources.ldap.auth.LDAPBackend
  identifiers:
    name: endpoints-agent-psso-password-password
  id: psso-password
  model: authentik_stages_password.passwordstage
- attrs:
    user_fields:
    - username
    - email
  identifiers:
    name: endpoints-agent-psso-password-identification
  id: psso-identification
  model: authentik_stages_identification.identificationstage
- identifiers:
    order: 10
    stage: !KeyOf psso-identification
    target: !KeyOf flow
  model: authentik_flows.flowstagebinding
- identifiers:
    order: 20
    stage: !KeyOf psso-password
    target: !KeyOf flow
  model: authentik_flows.flowstagebinding
