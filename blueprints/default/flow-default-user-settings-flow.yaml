version: 1
metadata:
  name: Default - User settings flow
entries:
  - attrs:
      designation: stage_configuration
      name: User settings
      title: Update your info
      authentication: require_authenticated
    identifiers:
      slug: default-user-settings-flow
    model: authentik_flows.flow
    id: flow
  - attrs:
      order: 200
      placeholder: Username
      placeholder_expression: false
      initial_value: |
        try:
            return user.username
        except:
            return ''
      initial_value_expression: true
      required: true
      type: username
      field_key: username
      label: Username
    identifiers:
      name: default-user-settings-field-username
    id: prompt-field-username
    model: authentik_stages_prompt.prompt
  - attrs:
      order: 201
      placeholder: Name
      placeholder_expression: false
      initial_value: |
        try:
            return user.name
        except:
            return ''
      initial_value_expression: true
      required: true
      type: text
      field_key: name
      label: Name
    identifiers:
      name: default-user-settings-field-name
    id: prompt-field-name
    model: authentik_stages_prompt.prompt
  - attrs:
      order: 202
      placeholder: Email
      placeholder_expression: false
      initial_value: |
        try:
            return user.email
        except:
            return ''
      initial_value_expression: true
      required: true
      type: email
      field_key: email
      label: Email
    identifiers:
      name: default-user-settings-field-email
    id: prompt-field-email
    model: authentik_stages_prompt.prompt
  - attrs:
      order: 203
      placeholder: Locale
      placeholder_expression: false
      initial_value: |
        try:
            return user.attributes.get("settings", {}).get("locale", "")
        except:
            return ''
      initial_value_expression: true
      required: true
      type: ak-locale
      field_key: attributes.settings.locale
      label: Locale
    identifiers:
      name: default-user-settings-field-locale
    id: prompt-field-locale
    model: authentik_stages_prompt.prompt
  # Replaced by a conditional policy
  - identifiers:
      name: default-user-settings-authorization
    model: authentik_policies_expression.expressionpolicy
    state: absent
  - attrs:
      missing_behavior: "false"
      actions:
        version: 2
        actions:
          # Deny changing the email if the user isn't allowed to
          - type: if
            condition:
              type: group
              op: all
              children:
                - type: compare
                  variable:
                    key: user.can_change_email
                  operator: is_false
                - type: group
                  op: none
                  children:
                    - type: compare
                      variable:
                        key: prompt_data
                        param: email
                        cast: string
                      operator: eq
                      value:
                        type: variable
                        variable:
                          key: user.email
            then_actions:
              - type: stop
                result: fail
                message: Not allowed to change email address.
          # Deny changing the name if the user isn't allowed to
          - type: if
            condition:
              type: group
              op: all
              children:
                - type: compare
                  variable:
                    key: user.can_change_name
                  operator: is_false
                - type: group
                  op: none
                  children:
                    - type: compare
                      variable:
                        key: prompt_data
                        param: name
                        cast: string
                      operator: eq
                      value:
                        type: variable
                        variable:
                          key: user.name
            then_actions:
              - type: stop
                result: fail
                message: Not allowed to change name.
          # Deny changing the username if the user isn't allowed to
          - type: if
            condition:
              type: group
              op: all
              children:
                - type: compare
                  variable:
                    key: user.can_change_username
                  operator: is_false
                - type: group
                  op: none
                  children:
                    - type: compare
                      variable:
                        key: prompt_data
                        param: username
                        cast: string
                      operator: eq
                      value:
                        type: variable
                        variable:
                          key: user.username
            then_actions:
              - type: stop
                result: fail
                message: Not allowed to change username.
    identifiers:
      name: default-user-settings-authorization
    id: default-user-settings-authorization
    model: authentik_policies_conditional.conditionalpolicy
  - identifiers:
      name: default-user-settings-write
    attrs:
      user_creation_mode: never_create
    id: default-user-settings-write
    model: authentik_stages_user_write.userwritestage
  - attrs:
      fields:
        - !KeyOf prompt-field-username
        - !KeyOf prompt-field-name
        - !KeyOf prompt-field-email
        - !KeyOf prompt-field-locale
      validation_policies:
        - !KeyOf default-user-settings-authorization
    identifiers:
      name: default-user-settings
    id: default-user-settings
    model: authentik_stages_prompt.promptstage
  - identifiers:
      order: 20
      stage: !KeyOf default-user-settings
      target: !KeyOf flow
    model: authentik_flows.flowstagebinding
  - identifiers:
      order: 100
      stage: !KeyOf default-user-settings-write
      target: !KeyOf flow
    model: authentik_flows.flowstagebinding
