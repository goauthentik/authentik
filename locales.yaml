    ship: true

  - tag: el-GR
    django: el_GR
    transifex: el_GR
    ship: false

  - tag: en
    django: en
    transifex: en # source language
    ship: true

  - tag: en-XA
    django: null # pseudo-locale: no backend catalog
    transifex: null # generated locally, never translated upstream
    ship: true

  - tag: es-ES
