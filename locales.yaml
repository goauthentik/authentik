# Canonical locale registry for authentik.
#
# This file is the source of truth for every language authentik knows about.
# Transifex cannot widen the set: CI rejects any locale file whose path does not
# correspond to a row here.
#
# Fields
#   tag        BCP-47 identity. Names web/xliff/<tag>.xlf and, when shipped, the
#              lit-localize targetLocale.
#   django     Directory under locale/. Must equal Django's to_locale(tag), which
#              a test enforces. null for frontend-only locales.
#   transifex  The language code Transifex uses upstream. Generates the global
#              settings.language_mapping in .github/transifex.yml, which is what
#              makes Transifex write canonical filenames. null when the locale is
#              not translated upstream.
#   ship       Whether the tag is emitted into web/lit-localize.json targetLocales.
#              A false row is known but not built: its files pass CI, no locale
#              module is generated, and users never see it in the picker.
#
# Do not hand-edit web/lit-localize.json, web/src/common/ui/locale/definitions.ts,
# or the language_mapping block in .github/transifex.yml. Edit this file and run
# `make gen-locales`.
#
# Adding a language: add the row, run `make gen-locales`, commit the result.
# Promoting one: flip ship to true and regenerate.

locales:
  - tag: ar
    django: ar
    transifex: ar_AA # upstream uses a private-use region; the plain tag is canonical
    ship: true

  - tag: bg-BG
    django: bg_BG
    transifex: bg_BG
    ship: true

  - tag: bn-BD
    django: bn_BD
    transifex: bn_BD
    ship: true

  - tag: ca-ES
    django: ca_ES
    transifex: ca_ES
    ship: false

  - tag: cs-CZ
    django: cs_CZ
    transifex: cs_CZ
    ship: true

  - tag: cy-GB
    django: cy_GB
    transifex: cy_GB
    ship: true

  - tag: da-DK
