# The authoritative list of authentik's UI languages.
#
#   tag:        BCP-47 tag. Names web/xliff/<tag>.xlf and the lit-localize target locale.
#   django:     Directory name under locale/, always Django's to_locale(tag).
#               null when the language has no backend catalog.
#   transifex:  The language code upstream on Transifex. null when Transifex doesn't
#               translate the language.
#   ship:       true to include the language in the web build and the language picker.
#
# Row order is the order of the generated lists. After editing this file, run
# `make gen-locales`; `make ci-lint-locales` fails when the tree drifts from it.
# See https://github.com/goauthentik/authentik/issues/24563.

locales:
  - { tag: ar, django: ar, transifex: ar_AA, ship: true }
  - { tag: bg-BG, django: bg_BG, transifex: bg_BG, ship: true }
  - { tag: bn-BD, django: bn_BD, transifex: bn_BD, ship: true }
