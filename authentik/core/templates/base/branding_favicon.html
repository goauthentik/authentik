{% with themed=brand.branding_favicon_themed_urls %}
{% if themed %}
<link rel="icon" href="{{ themed.light }}" media="(prefers-color-scheme: light)">
<link rel="icon" href="{{ themed.dark }}" media="(prefers-color-scheme: dark)">
<link rel="shortcut icon" href="{{ themed.light }}">
{% else %}
<link rel="icon" href="{{ brand.branding_favicon_url }}">
<link rel="shortcut icon" href="{{ brand.branding_favicon_url }}">
{% endif %}
{% endwith %}
